<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="System online boot sequence animation"><defs><style>@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.15}}@keyframes fill{0%{width:0}100%{width:1112px}}@keyframes pulse{50%{opacity:.4}}.blink{animation:blink 1s steps(2) infinite}.pulse{animation:pulse 1.8s ease infinite}.bar{animation:fill 4s ease-in-out infinite alternate}</style></defs><rect width="1200" height="240" rx="12" fill="#080e16" stroke="#39ff14" stroke-width="2"/><g font-family="monospace"><text x="40" y="48" font-size="21" fill="#39ff14">BOOT SEQUENCE COMPLETE</text><text x="1160" y="48" text-anchor="end" font-size="15" fill="#00bfff">SECURITY ARCADE // ACCESS GRANTED</text><text x="42" y="92" fill="#a8bbc9" font-size="15">IDENTITY</text><text x="240" y="92" fill="#39ff14" font-size="15">GARETH SHELDON</text><text x="605" y="92" fill="#a8bbc9" font-size="15">SYSTEM STATUS</text><text x="810" y="92" fill="#39ff14" font-size="15" class="pulse">ONLINE</text><text x="42" y="138" fill="#a8bbc9" font-size="15">LOADOUT</text><text x="240" y="138" fill="#00bfff" font-size="15">CLOUD / DETECTION / AI SECURITY</text><text x="605" y="138" fill="#a8bbc9" font-size="15">MISSION QUEUE</text><text x="810" y="138" fill="#ffd700" font-size="15">READY</text><rect x="42" y="170" width="1116" height="15" rx="4" fill="#142a2a" stroke="#245b4d"/><rect x="44" y="172" width="0" height="11" rx="3" fill="#39ff14" class="bar"/><text x="42" y="217" fill="#39ff14" font-size="13">[ PUBLIC PROFILE ]</text><text x="1158" y="217" text-anchor="end" fill="#00bfff" font-size="13" class="blink">CLICK A PANEL TO EXPAND</text></g></svg>